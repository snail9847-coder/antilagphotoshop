name: Apply reviewed lifecycle fix
on:
  push:
    branches: [fix/guard-reliability-tests]
    paths: [.github/workflows/apply-lifecycle-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guard-reliability-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply checked source replacements
        shell: python
        run: |
          import ast
          import difflib
          from pathlib import Path
          import textwrap

          path = Path('antilagphotoshop.py')
          original = path.read_text(encoding='utf-8')
          source = original
          def replace_once(old, new):
              global source
              if source.count(old) != 1:
                  raise RuntimeError('Expected one source match: ' + repr(old))
              source = source.replace(old, new, 1)

          replace_once(
              '            flags = getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)',
              '            # Process checks and environment checks may take several seconds.\n'
              '            # Honour an Exit or Pause requested while they were running.\n'
              '            if self.stop_event.is_set() or (self.paused and not manual):\n'
              '                return False\n'
              '            flags = getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)',
          )
          replace_once(
              '                self.paused = not self.paused',
              '                # Resume also works when started with --no-auto-start.\n'
              '                self.paused = bool(self.auto_start and not self.paused)',
          )

          def method_span(name):
              tree = ast.parse(source)
              cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'AntilagPhotoshop')
              node = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == name)
              return node.lineno - 1, node.end_lineno

          # Keep the launch lock held through taskkill, not just while setting pause.
          start, end = method_span('close_photoshop_forced')
          lines = source.splitlines(keepends=True)
          block = ''.join(lines[start:end])
          marker = '        try:\n'
          if block.count(marker) != 1:
              raise RuntimeError('Unexpected force-close structure')
          prefix, body = block.split(marker, 1)
          block = prefix + textwrap.indent(marker + body, '    ')
          lines[start:end] = [block]
          source = ''.join(lines)

          # Free the native menu even if building/tracking/handling it raises.
          start, end = method_span('show_menu')
          lines = source.splitlines(keepends=True)
          block = ''.join(lines[start:end])
          if block.count('        try:\n') != 1 or block.count('            user32.DestroyMenu(menu)\n') != 1:
              raise RuntimeError('Unexpected menu structure')
          block = block.replace('        try:\n', '        menu = None\n        try:\n', 1)
          block = block.replace('            user32.DestroyMenu(menu)\n', '', 1)
          block += '        finally:\n            if menu:\n                ctypes.windll.user32.DestroyMenu(menu)\n'
          lines[start:end] = [block]
          source = ''.join(lines)

          # Cleanup must tolerate partial startup and repeated WM_CLOSE/finally calls.
          start, end = method_span('shutdown')
          lines = source.splitlines(keepends=True)
          replacement = '''    def shutdown(self) -> None:
                  self.stop_event.set()
                  hwnd = self.hwnd
                  try:
                      if hwnd:
                          ctypes.windll.user32.KillTimer(hwnd, 1)
                          try:
                              if hasattr(self, "_notify_cls"):
                                  nid = self._notify_cls()
                                  nid.cbSize = ctypes.sizeof(self._notify_cls)
                                  nid.hWnd = hwnd
                                  nid.uID = 1
                                  ctypes.windll.shell32.Shell_NotifyIconW(2, ctypes.byref(nid))
                          finally:
                              ctypes.windll.user32.DestroyWindow(hwnd)
                  finally:
                      self.hwnd = None
                      try:
                          if self.icon_handle and self._owns_icon:
                              ctypes.windll.user32.DestroyIcon(self.icon_handle)
                      finally:
                          self.icon_handle = None
                          self._owns_icon = False
          '''
          # Preserve the four-space class indentation without reformatting other code.
          replacement = replacement.splitlines()
          replacement = replacement[0] + '\n' + '\n'.join(line[6:] for line in replacement[1:]) + '\n'
          lines[start:end] = [replacement]
          source = ''.join(lines)
          compile(source, str(path), 'exec')
          with path.open('w', encoding='utf-8', newline='\n') as handle:
              handle.write(source)
          print(''.join(difflib.unified_diff(original.splitlines(True), source.splitlines(True), fromfile='before', tofile='after')))
      - name: All unit regressions
        run: python -m unittest -v test_antilagphotoshop test_regressions test_supervisor_regressions test_guard_lifecycle
      - name: Native Windows smoke tests
        run: python -m unittest -v test_windows_smoke
      - name: Commit only the verified application file
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- antilagphotoshop.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: serialize close and launch, honour pause and exit, and clean tray resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/guard-reliability-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
