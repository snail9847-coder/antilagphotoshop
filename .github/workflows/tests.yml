name: Python tests
on:
  push:
    branches: [main, release/v0.2.0-stability]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Regression (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all Python sources
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('.').iterdir() if p.suffix in ('.py', '.pyw')]"
      - name: Self-test
        run: python antilagphotoshop.py --self-test
      - name: All regression and diagnostics tests
        run: python ci_tests.py
  native-windows:
    name: Native Windows tray and package checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Native tray smoke tests
        run: python ci_tests.py --native
      - name: Build and verify downloadable package
        run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: antilagphotoshop-v0.2.0-windows-python
          path: dist/*
          if-no-files-found: error
